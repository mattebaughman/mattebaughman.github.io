[build]
build_dir = "./_site"
templates_dir = "./templates"
static_dir = "./static"

[overview]
name = "Matt Baughman"
titles = ["Postdoctoral Computational Scientist", "Princeton University & PPPL"]
headshot = "images/headshot.jpg"
contacts = [
    { name = "email", link = "mailto:mbaughman123@gmail.com" },
    { name = "github", link = "https://github.com/mattebaughman" },
    { name = "linkedin", link = "https://www.linkedin.com/in/mattebaughman/" },
    { name = "scholar", link = "https://scholar.google.com/citations?user=oehomH0AAAAJ" },
]
analytics = ""
source = "https://github.com/mattebaughman/mattebaughman.github.io/"
text = """
Hi there!
I'm a Postdoctoral Computational Scientist at <a href="https://www.princeton.edu/" target="_blank">Princeton</a>, working within the DOE's <a href="https://www.pppl.gov/" target="_blank">Princeton Plasma Physics Laboratory</a> with <a href="https://www.pppl.gov/people/shantenu-jha" target="_blank">Shantenu Jha</a>. Most of my current work is part of the DOE's Genesis Mission, building multi-agent systems that run scientific campaigns end to end: proposing experiments, executing simulations on leadership-class machines, and evaluating what comes back. I also work on the skill and context mechanisms those systems need to stay tractable as they grow.
Before Princeton, I completed my Ph.D. in Computer Science with <a href="https://labs.globus.org" target="_blank">Globus Labs</a> at the <a href="https://cs.uchicago.edu/" target="_blank">University of Chicago</a> in August 2025, advised by <a href="https://cs.uchicago.edu/people/ian-foster/" target="_blank">Ian Foster</a> and <a href="https://kylechard.com/" target="_blank">Kyle Chard</a>. My dissertation was on cost-aware placement of work across heterogeneous, federated systems; I now work that same problem one layer up, with agents as the thing being placed.
I completed my Bachelor's in Computer Science and Philosophy at <a href="https://minerva.edu/" target="_blank">Minerva University</a>, and have worked at <a href="https://www.anl.gov/" target="_blank">Argonne National Laboratory</a>, <a href="https://opinary.com/" target="_blank">Opinary</a>, and Google.
"""

[research]
sections = [
    { name = "Distributed Agentic Systems", text = "We are building multi-agent systems that run scientific campaigns autonomously: coordinators that manage a campaign, proposal agents that choose the next experiment, and evaluators that score results and decide when to stop, with the physics codes left untouched underneath." },
    { name = "AI for Science", text = "We are putting foundation models and learned surrogates for fusion energy to work inside real optimization loops, coupling them to the simulation codes they stand in for and to the facilities those codes run on." },
    { name = "Cost-aware Computing", text = "We are building scalable frameworks for highly distributed science workflows spanning dozens of computing sites and scaling to tens of thousands of compute nodes using novel cost-aware task placement algorithms and federated function-as-a-service infrastructure."}
]

[projects]
github = "https://github.com/mattebaughman/"
links = [
    { name = "science_skill_demo", description = "A single prompt plus a few agent skills that get any coding agent to build a working multi-agent optimization campaign: competing search strategies measured against a hidden response surface, with a skeptical aggregator that re-measures each claimed result before trusting it. Verified by clean-room rebuilds from the prompt alone.", link = "https://github.com/mattebaughman/science_skill_demo" },
    { name = "Genesis Skills", description = "A portable agent-skill catalog for the DOE Genesis Mission, plus a dependency-free search engine that loads skills progressively instead of flat-loading the catalog into context, cutting the context cost of the catalog by roughly 19x. Skills must run from any agent harness, so nothing harness-specific is admitted." },
    { name = "IGNOS", description = "An evolutionary and Bayesian outer loop over plasma profile parameters for core-edge integration, running one candidate per GPU against diffusion-model imputation and simulation surrogates, with every campaign and candidate tracked as nested experiment runs." },
    { name = "Tritium Splash", description = "An agentic control loop for tritium-breeding blanket design, searching for configurations that sustain their own fuel supply. A campaign layer proposes and evaluates experiments while an inner orchestrator executes a declarative graph over neutronics, chemistry, materials, and quantum agents, each backed by a surrogate or the real simulation code depending on what a given facility can run." },
]

[publications]
bibtex = "publications/baughman.bib"
publications_dir = "./config/publications"

# Publication categories: maps the "category" field used in
# config/publications/*.json files to the heading shown on the site.
[publications.categories]
systems = "Distributed Systems"
ml = "Federated Learning"
science = "AI for Science & Applications"

[presentations]
presentations_dir = "./config/presentations"

[theses]
theses_dir = "./config/theses"
