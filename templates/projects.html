{% for project in config.projects.links %}
{% if project.name %}
<div class="bullet">
    <div>
        <i class="material-icons">chevron_right</i>
    </div>
    <div class="bullet-entry">
        <b>{{ project.name }}:</b> {{ project.description }}
        {% if project.link %}[<a href="{{ project.link }}">Code</a>]{% endif %}
        {% if project.video %}[<a href="{{ project.video }}">Video</a>]{% endif %}
    </div>
</div>
{% endif %}
{% endfor %}
